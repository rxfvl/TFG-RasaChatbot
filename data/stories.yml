version: "3.1"

stories:

# ---------------------------------------------------------------------------
# Saludos y estados de ánimo (flujos multi-turno)
# ---------------------------------------------------------------------------

- story: happy path
  steps:
  - intent: greet
  - action: action_registrar_intent
  - action: action_check_registro
  - slot_was_set:
    - requiere_registro: false
  - action: utter_greet
  - intent: mood_great
  - action: action_registrar_intent
  - action: utter_happy

- story: sad path 1
  steps:
  - intent: greet
  - action: action_registrar_intent
  - action: action_check_registro
  - slot_was_set:
    - requiere_registro: false
  - action: utter_greet
  - intent: mood_unhappy
  - action: action_registrar_intent
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: affirm
  - action: action_registrar_intent
  - action: utter_happy

- story: sad path 2
  steps:
  - intent: greet
  - action: action_registrar_intent
  - action: action_check_registro
  - slot_was_set:
    - requiere_registro: false
  - action: utter_greet
  - intent: mood_unhappy
  - action: action_registrar_intent
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: deny
  - action: action_registrar_intent
  - action: utter_goodbye

# ---------------------------------------------------------------------------
# Horarios teoría/práctica (flujo multi-turno: menú → selección)
# ---------------------------------------------------------------------------

- story: clases teoricas
  steps:
  - intent: fechas_tp
  - action: action_registrar_intent
  - action: utter_fechas_tp
  - intent: teoria
  - action: action_registrar_intent
  - action: utter_fechas_horarios_teoria

- story: clases practicas
  steps:
  - intent: fechas_tp
  - action: action_registrar_intent
  - action: utter_fechas_tp
  - intent: practica
  - action: action_registrar_intent
  - action: utter_fechas_horarios_practica

# ---------------------------------------------------------------------------
# Repaso: cuestionarios / conceptos / ejercicios (desde menú principal)
# Estos mantienen contexto: cuestionarios/conceptos/ejercicios solos
# muestran lista de temas; combinados con seleccionar_tema, inician el flujo.
# ---------------------------------------------------------------------------

- story: Cuestionario-Repaso
  steps:
  - intent: cuestionarios
  - action: action_registrar_intent
  - action: action_listar_temas

- story: Concepto-Repaso
  steps:
  - intent: conceptos
  - action: action_registrar_intent
  - action: action_listar_temas

- story: Ejercicio-Repaso
  steps:
  - intent: ejercicios
  - action: action_registrar_intent
  - action: action_listar_temas

# ---------------------------------------------------------------------------
# Ejercicios Tema 2 (flujo multi-turno)
# ---------------------------------------------------------------------------

- story: ejerciciosTema2
  steps:
  - intent: tema2
  - action: action_registrar_intent
  - action: utter_tipo_ejercicio
  - intent: ejercicios
  - action: action_registrar_intent
  - action: utter_ejerciciosT2

- story: ejercicio dijsktra acierto
  steps:
  - intent: dijkstra
  - action: action_registrar_intent
  - action: utter_e1t2
  - action: utter_ejerDijsktra
  - intent: ejercicioDijsktra
  - action: action_registrar_intent
  - action: utter_respuesta_correcta

- story: ejercicio dijsktra fallo
  steps:
  - intent: dijkstra
  - action: action_registrar_intent
  - action: utter_e1t2
  - action: utter_ejerDijsktra
  - or:
    - intent: FalloejercicioDijsktrab
    - intent: FalloejercicioDijsktrc
  - action: action_registrar_intent
  - action: utter_falloEjercicios
  - action: utter_respuesta_correcta_e1t2

- story: ejercicio encaminamiento acierto
  steps:
  - intent: encaminamiento
  - action: action_registrar_intent
  - action: utter_e2t2
  - action: utter_ejerEncaminamiento
  - intent: ejercicioEncaminamiento
  - action: action_registrar_intent
  - action: utter_respuesta_correcta

- story: ejercicio encaminamiento fallo
  steps:
  - intent: encaminamiento
  - action: action_registrar_intent
  - action: utter_e2t2
  - action: utter_ejerEncaminamiento
  - or:
    - intent: FalloejercicioEncaminamientoc
    - intent: FalloejercicioEncaminamientoa
  - action: action_registrar_intent
  - action: utter_falloEjercicios
  - action: utter_respuesta_correcta_e2t2

- story: ejercicio ruta acierto
  steps:
  - intent: ruta
  - action: action_registrar_intent
  - action: utter_e3t2
  - action: utter_rutas_paquetes
  - intent: ejercicioRuta
  - action: action_registrar_intent
  - action: utter_respuesta_correcta

- story: ejercicio ruta fallo
  steps:
  - intent: ruta
  - action: action_registrar_intent
  - action: utter_e3t2
  - action: utter_rutas_paquetes
  - or:
    - intent: FalloejercicioRutaa
    - intent: FalloejercicioRutab
  - action: action_registrar_intent
  - action: utter_falloEjercicios
  - action: utter_respuesta_correcta_e3t2

# ---------------------------------------------------------------------------
# Flujo dinámico de conceptos (multi-turno: selección tema → lista → detalle)
# ---------------------------------------------------------------------------

- story: conceptos - seleccionar tema
  steps:
  - intent: seleccionar_tema
  - action: action_registrar_intent
  - action: utter_tipo_ejercicio
  - intent: conceptos
  - action: action_registrar_intent
  - action: action_listar_conceptos

# ---------------------------------------------------------------------------
# Flujo de cuestionarios dinámicos (multi-turno)
# ---------------------------------------------------------------------------

- story: inicio_cuestionario_dinamico
  steps:
  - intent: seleccionar_tema
  - action: action_registrar_intent
  - action: utter_tipo_ejercicio
  - intent: cuestionarios
  - action: action_registrar_intent
  - action: action_reset_cuestionario_dinamico
  - action: cuestionario_dinamico_form
  - active_loop: cuestionario_dinamico_form
  - active_loop: null
  - action: utter_fin_test

