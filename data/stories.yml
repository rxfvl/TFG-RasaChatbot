  - action: utter_noticia
  
- story: ejerciciosTema2
  steps:
  - intent: tema2
  - action: utter_tipo_ejercicio
  - intent: ejercicios
  - action: utter_ejerciciosT2
  
- story: ejercicio dijsktra acierto
  steps:
  - intent: dijkstra
  - action: utter_e1t2 
  - action: utter_ejerDijsktra
  - intent: ejercicioDijsktra
  - action: utter_respuesta_correcta
  
- story: ejercicio dijsktra fallo
  steps:
  - intent: dijkstra
  - action: utter_e1t2 
  - action: utter_ejerDijsktra
  - or:
    - intent: FalloejercicioDijsktrab
    - intent: FalloejercicioDijsktrc
  - action: utter_falloEjercicios
  - action: utter_respuesta_correcta_e1t2
  
- story: ejercicio encaminamiento acierto
  steps:
  - intent: encaminamiento
  - action: utter_e2t2 
  - action: utter_ejerEncaminamiento
  - intent: ejercicioEncaminamiento
  - action: utter_respuesta_correcta
  
- story: ejercicio encaminamiento fallo
  steps:
  - intent: encaminamiento
  - action: utter_e2t2 
  - action: utter_ejerEncaminamiento
  - or:
    - intent: FalloejercicioEncaminamientoc
    - intent: FalloejercicioEncaminamientoa
  - action: utter_falloEjercicios
  - action: utter_respuesta_correcta_e2t2
  
- story: ejercicio ruta acierto
  steps:
  - intent: ruta
  - action: utter_e3t2 
  - action: utter_rutas_paquetes
  - intent: ejercicioRuta
  - action: utter_respuesta_correcta
  
- story: ejercicio ruta fallo
  steps:
  - intent: ruta
  - action: utter_e3t2 
  - action: utter_rutas_paquetes
  - or:
    - intent: FalloejercicioRutaa
    - intent: FalloejercicioRutab
  - action: utter_falloEjercicios
  - action: utter_respuesta_correcta_e3t2
  
# Flujo dinámico de conceptos
# 1. Selección del tema (desde el menú de repaso)
- story: conceptos - seleccionar tema
  steps:
  - intent: seleccionar_tema
  - action: utter_tipo_ejercicio
  - intent: conceptos
  - action: action_listar_conceptos

# 2. El usuario pulsa un botón de concepto → se muestra la definición
- story: conceptos - ver definicion
  steps:
  - intent: seleccionar_concepto
  - action: action_dar_concepto

# Flujo de cuestionarios dinámicos
- story: inicio_cuestionario_dinamico
  steps:
  - intent: seleccionar_tema
  - action: utter_tipo_ejercicio
  - intent: cuestionarios
  - action: action_reset_cuestionario_dinamico
  - action: cuestionario_dinamico_form
  - active_loop: cuestionario_dinamico_form
  - active_loop: null
  - action: utter_fin_test
