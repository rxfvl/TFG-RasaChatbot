version: "3.1"
  
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - fechas_horarios_teoria
  - fechas_horarios_practica
  - lunes
  - martes
  - miercoles
  - jueves
  - viernes
  - teoria
  - practica
  - fechas_tp
  - gracias
  - profesorado
  - tema1
  - tema2
  - tema3
  - tema4
  - tema5
  - repasar
  - set_resultado_defs
  - cuestionarios
  - conceptos
  - ejercicios
  - correos_profesor
  - entregas
  - noticia
  - seleccionar_tema
  - seleccionar_concepto
  - seleccionar_cuestionario
  - ver_progreso
  - salir_cuestionario
  - recomendar

entities:
  - tema_actual
  - concepto_id
  - tipo_cuestionario
  - cuestionario_id_seleccionado

slots:
  requiere_registro:
    type: bool
    influence_conversation: true
    mappings:
    - type: custom
  nombre:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      conditions:
      - active_loop: registro_form
        requested_slot: nombre
  correo:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      conditions:
      - active_loop: registro_form
        requested_slot: correo
  tema_actual:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: tema_actual

  concepto_id:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: concepto_id

  pregunta_actual_idx:
    type: any
    influence_conversation: false
    initial_value: 0
    mappings:
    - type: custom
  respuesta_generica:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      not_intent:
        - salir_cuestionario
      conditions:
      - active_loop: cuestionario_dinamico_form

  seguimiento_id:
    type: any
    influence_conversation: false
    initial_value: null
    mappings:
    - type: custom

  aciertos_cuestionario:
    type: any
    influence_conversation: false
    initial_value: 0
    mappings:
    - type: custom

  matriculado:
    type: bool
    influence_conversation: false
    initial_value: null
    mappings:
    - type: custom
  tipo_cuestionario:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: tipo_cuestionario
  cuestionario_id_seleccionado:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: cuestionario_id_seleccionado
      
forms:
  registro_form:
    required_slots:
      - nombre
      - correo
  cuestionario_dinamico_form:
    required_slots:
      - respuesta_generica

actions:
  - action_check_registro
  - action_guardar_alumno
  - validate_registro_form
  - validate_cuestionario_dinamico_form
  - action_ask_respuesta_generica
  - action_reset_cuestionario_dinamico
  - action_listar_temas
  - action_listar_conceptos
  - action_dar_concepto
  - action_registrar_intent
  - action_default_fallback
  - action_check_matricula
  - action_mostrar_progreso
  - action_cancelar_cuestionario
  - action_mostrar_horario
  - action_mostrar_profesorado_tutorias
  - action_listar_cuestionarios
  - action_recomendar

responses:
  utter_ask_nombre:
  - text: "¡Hola! Parece que es tu primera vez aquí. ¿Cómo te llamas?"
  utter_ask_correo:
  - text: "Encantado de conocerte. ¿Cuál es tu correo universitario (terminado en @uco.es)?"
  utter_registro_completado:
  - text: "¡Perfecto! Ya estás registrado/a."
  
  utter_greet:
  - text: "Hola, ¿qué duda tienes?"
  - text: "Hola, ¿necesitas alguna información?"
  - text: "Buenas, ¿qué duda tienes?"
  
  utter_preg_defs:
  - text: |-
      Resultado de preg defs
       - res_def: {res_def}

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "¿Puedo ayudarte en algo?"

  utter_happy:
  - text: "Bien, ¡me alegro!"

  utter_goodbye:
  - text: "Adios, que tenga un buen día"
  - text: "Hasta luego"
  - text: "Hasta pronto"
  - text: "Ten un buen día"

  utter_iamabot:
  - text: "Soy un robot, me llamo Rasa."
  

  
  utter_gracias:
  - text: "De nada, un placer"
  - text: "De nada"
  

        
  utter_fin_test:
  - text: "¡Perfecto! Hemos finalizado el cuestionario."
  
  utter_acierto_p1t1:
  - text: "¡Pregunta 1 acertada!"
  
  utter_acierto_p2t1:
  - text: "¡Pregunta 2 acertada!"
  
  utter_acierto_p3t1:
  - text: "¡Pregunta 3 acertada!"
  
  utter_acierto_p4t1:
  - text: "¡Pregunta 4 acertada!"
  

  
  utter_fallo:
  - text: "Ohhh has fallado esta pregunta, no te desanimes el cuestionario aun no ha terminado."
  
  utter_ultimo_fallo:
  - text: "Que pena, has fallado la última pregunta."
  
  utter_respuesta_correcta_ap1t1:
  - text: "La respuesta correcta era la A \nRetroalimentación: Debe repasar los tipos de estándar"
  
  utter_respuesta_correcta_ap3t1:
  - text: "La respuesta correcta era la A \nRetroalimentación: Debe repasar las capas del modelo OSI"
  
  utter_respuesta_correcta_cp4t1:
  - text: "La respuesta correcta era la C \nRetroalimentación: Debe repasar el modelo OSI"
  
  utter_respuesta_correcta_cp2t1:
  - text: "La respuesta correcta era la C \nRetroalimentación: Debe repasar el tipo de redes"
          
  utter_fechas_horarios_teoria:
  - text: "Elija el día del que desea la información"
  
    buttons:
      - title: "Clase del martes teórica"
        payload: "/martes"
        
      - title: "Clase del jueves teórica"
        payload: "/jueves"
        
  utter_fechas_horarios_practica:
  - text: "Elija el día del que desea la información"
  
    buttons:
      - title: "Clase del lunes práctica"
        payload: "/lunes"
        
      - title: "Clase del miércoles práctica"
        payload: "/miercoles"
        
      - title: "Clase del viernes práctica"
        payload: "/viernes"
        

    
  utter_fechas_tp:
  - text: "¿Desea saber los horarios de teoría o práctica?"
  
    buttons:
      - title: "Clases de teoría"
        payload: "/teoria"
        
      - title: "Clase de práctica"
        payload: "/practica"
        
  utter_tipo_ejercicio:
  - text: "¿Qué tipo de repaso desea?"
    buttons:
      - title: "Conceptos"
        payload: "/conceptos"
      - title: "Cuestionarios de Teoría"
        payload: '/cuestionarios{"tipo_cuestionario":"teoria"}'
      - title: "Ejercicios Prácticos"
        payload: '/cuestionarios{"tipo_cuestionario":"practica"}'
  utter_ask_p1t1_answer:
  - text: "Cuando un Estándar se establece por su extensa utilización se dice que es un estándar\n\n
  A1) De facto\n
  B1) De jure\n
  C1) Ninguna de las anteriores"
        
        
  utter_ask_p2t1_answer:
  - text: "Clasificación de las redes por su extensión\n\n
  A2) Públicas y Privadas\n
  B2) Difusión y Punto a Punto\n
  C2) LAN y WAN"
        
  utter_ask_p3t1_answer:
  - text: "¿Cuál de las siguientes listas enumera las capas del modelo OSI correctamente ordenadas?\n\n
  A3) Física - enlace de datos - red - transporte - sesión - presentación - aplicación\n
  B3) Física - enlace de datos - red - transporte - presentación - sesión - aplicación\n
  C3) Física - enlace de datos - red - transporte - aplicación -  presentación - sesión"


  utter_ask_p4t1_answer:
  - text: "En el modelo OSI, el encaminamiento es una tarea que realiza la\n\n
  A4) Capa de transporte\n
  B4) Capa de aplicación\n
  C4) Capa de red"
    
  utter_entregas:
  - text: "Las entregas que debes enviar a lo largo del curso son las siguientes: \n\n
  Cuestionario Tema 1 (30 de Septiembre 2022)\n
  Cuestionario Tema 2 (6 de Octubre 2022)\n
  Cuestionario Tema 3 (15 de Octubre 2022)\n
  Cuestionario Tema 4 (30 de Octubre 2022)\n
  Cuestionario Tema 5 (8 de Noviembre 2022)\n
  Cuestionario Tema 6 (25 de Noviembre 2022)\n
  Primer parcial (4 de Diciembre 2022)\n
  Segundo parcial (16 de Diciembre 2022)\n
  Primera convocatoria (8 de Enero 2023)\n
  Segunda convocatoria (27 de Enero 2023)\n
  Entrega ejericicio 1 (Fecha pendiente de confirmar)\n
  Entrega ejericicio 2 (Fecha pendiente de confirmar)\n
  Entrega ejericicio 3 (Fecha pendiente de confirmar)\n
  Entrega ejericicio 4 (Fecha pendiente de confirmar)\n"
  
  utter_respuesta_correcta_e1t2:
  - text: "La respuesta correcta era la A"


  utter_respuesta_correcta:
  - text: "La respuesta correcta, ¡muy bien!"  

  
  utter_noticia:
  - text: "La noticia de la semana es la siguiente:\n [Ciberseguridad: Una nueva técnica del 'malware' sin archivos aprovecha los registros de eventos de Windows para ocultarse](https://www.cope.es/actualidad/tecnologia/noticias/ciberseguridad-una-nueva-tecnica-del-malware-sin-archivos-aprovecha-los-registros-eventos-windows-para-ocultarse-20220524_2101869)"
  
