version: "3.1"
  
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - greet
  - start
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - lunes
  - martes
  - miercoles
  - jueves
  - viernes
  - teoria
  - practica
  - fechas_tp
  - gracias
  - profesorado
  - repasar
  - cuestionarios
  - conceptos
  - ejercicios
  - correos_profesor
  - entregas
  - noticia
  - seleccionar_tema
  - seleccionar_concepto
  - seleccionar_cuestionario
  - ver_progreso
  - salir_cuestionario
  - recomendar

entities:
  - tema_actual
  - concepto_id
  - tipo_cuestionario
  - cuestionario_id_seleccionado

slots:
  requiere_registro:
    type: bool
    influence_conversation: true
    mappings:
    - type: custom
  nombre:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      conditions:
      - active_loop: registro_form
        requested_slot: nombre
  correo:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      conditions:
      - active_loop: registro_form
        requested_slot: correo
  tema_actual:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: tema_actual

  concepto_id:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: concepto_id

  pregunta_actual_idx:
    type: any
    influence_conversation: false
    initial_value: 0
    mappings:
    - type: custom
  respuesta_generica:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      not_intent:
        - salir_cuestionario
      conditions:
      - active_loop: cuestionario_dinamico_form

  seguimiento_id:
    type: any
    influence_conversation: false
    initial_value: null
    mappings:
    - type: custom

  aciertos_cuestionario:
    type: any
    influence_conversation: false
    initial_value: 0
    mappings:
    - type: custom

  matriculado:
    type: bool
    influence_conversation: false
    initial_value: null
    mappings:
    - type: custom
  tipo_cuestionario:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: tipo_cuestionario
  cuestionario_id_seleccionado:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: cuestionario_id_seleccionado
      
forms:
  registro_form:
    required_slots:
      - nombre
      - correo
  cuestionario_dinamico_form:
    required_slots:
      - respuesta_generica

actions:
  - action_check_registro
  - action_guardar_alumno
  - validate_registro_form
  - validate_cuestionario_dinamico_form
  - action_ask_respuesta_generica
  - action_reset_cuestionario_dinamico
  - action_listar_temas
  - action_listar_conceptos
  - action_dar_concepto
  - action_registrar_intent
  - action_default_fallback
  - action_check_matricula
  - action_mostrar_progreso
  - action_cancelar_cuestionario
  - action_mostrar_horario
  - action_mostrar_menu_horario
  - action_mostrar_profesorado_tutorias
  - action_listar_cuestionarios
  - action_recomendar
  - action_mostrar_entregas
  - action_mostrar_noticia

responses:
  utter_ask_nombre:
  - text: "¡Hola! Parece que es tu primera vez aquí. ¿Cómo te llamas?"
  utter_ask_correo:
  - text: "Encantado de conocerte. ¿Cuál es tu correo universitario (terminado en @uco.es)?"
  utter_registro_completado:
  - text: "¡Perfecto! Ya estás registrado/a."
  
  utter_greet:
  - text: "Hola, ¿qué duda tienes?"
  - text: "Hola, ¿necesitas alguna información?"
  - text: "Buenas, ¿qué duda tienes?"
  
  utter_no_en_cuestionario:
  - text: "Ahora mismo no estás haciendo ningún cuestionario."
  

  utter_cheer_up:
  - text: "Aquí tienes algo para animarte:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "¿Puedo ayudarte en algo?"

  utter_happy:
  - text: "Bien, ¡me alegro!"

  utter_goodbye:
  - text: "Adios, que tenga un buen día"
  - text: "Hasta luego"
  - text: "Hasta pronto"
  - text: "Ten un buen día"

  utter_iamabot:
  - text: "Soy un robot, me llamo Rasa."
  

  
  utter_gracias:
  - text: "De nada, un placer"
  - text: "De nada"
  

        
  utter_fin_test:
  - text: "¡Perfecto! Hemos finalizado el cuestionario."
  

  utter_fechas_tp:
  - text: "¿Desea saber los horarios de teoría o práctica?"
  
    buttons:
      - title: "Clases de teoría"
        payload: "/teoria"
        
      - title: "Clase de práctica"
        payload: "/practica"
        
  utter_tipo_ejercicio:
  - text: "¿Qué tipo de repaso desea?"
    buttons:
      - title: "Conceptos"
        payload: "/conceptos"
      - title: "Cuestionarios de Teoría"
        payload: '/cuestionarios{"tipo_cuestionario":"teoria"}'
      - title: "Ejercicios Prácticos"
        payload: '/cuestionarios{"tipo_cuestionario":"practica"}'

